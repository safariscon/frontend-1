name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Check Docker image build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: docker build --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://umuhuzaback.onrender.com}" -t safariscon-web:${{ github.sha }} .

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_NAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "Dockerfile,.dockerignore,docker-compose.yml,nginx.conf,package.json,package-lock.json,index.html,vite.config.js,src,public"
          target: "/tmp/safariscon-web"
          rm: true

      - name: Build and run Docker image on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_NAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: VITE_API_BASE_URL
          script: |
            set -e
            cd /tmp/safariscon-web
            docker build --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL:-https://umuhuzaback.onrender.com}" -t safariscon-web:latest .
            docker rm -f safariscon-web || true
            docker run -d \
              --name safariscon-web \
              --restart unless-stopped \
              -p 4174:80 \
              safariscon-web:latest
